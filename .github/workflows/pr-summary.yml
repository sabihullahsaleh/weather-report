name: Codex PR Summary

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Codex prompt
        id: prompt
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/codex-pr-summary.txt`;
            const response = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              headers: { accept: 'application/vnd.github.v3.diff' },
            });
            const instructions = [
              'You are preparing a concise pull request summary describing the key changes, risks, and follow-up actions.',
              'Keep it under 150 words and write in paragraph form.',
              'Diff:',
              '```diff',
              response.data,
              '```'
            ].join('\n');
            fs.writeFileSync(path, instructions);
            core.setOutput('prompt-path', path);

      - name: Ask Codex for summary
        id: codex
        uses: openai/codex-action@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prompt.outputs.prompt-path }}
          working-directory: ${{ github.workspace }}

      - name: Post Codex summary
        if: steps.codex.outputs.final_message != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = `${{ toJSON(steps.codex.outputs.final_message) }}`.trim();
            if (!summary) {
              core.info('Codex returned an empty summary.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `### Codex Suggested Summary\n\n${summary}`
            });
