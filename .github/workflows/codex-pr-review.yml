name: Codex PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

jobs:
  codex-review:
    name: Codex Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Run Codex PR review
        id: codex
        uses: openai/codex-action@main
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          prompt_file: .github/prompts/codex-pr-review.md
          working_directory: ${{ github.workspace }}

      - name: Post Codex review to PR
        if: github.event_name == 'pull_request' && steps.codex.outputs.final_message != ''
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ steps.codex.outputs.final_message }}
        with:
          script: |
            const core = require('@actions/core');
            const body = (process.env.CODEX_REVIEW || '').trim();
            if (!body) {
              core.info('Codex did not produce review content.');
              return;
            }
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body,
              event: 'COMMENT'
            });
